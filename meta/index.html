<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta — Codebase Stats</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="main.js"></script>
</head>
<body>
    <h1>Meta</h1>
    <p>Stats and visualizations about this portfolio's codebase.</p>

    <!-- Commit time slider -->
    <div class="time-filter">
        <label>
            Show commits until:
            <input type="range" id="commit-progress" min="0" max="100" value="100">
            <time id="commit-time"></time>
        </label>
    </div>

    <!-- Summary stats -->
    <div id="stats"></div>

    <!-- Scrollytelling wrapper -->
    <div id="scrolly-1">
        <div id="scatter-story">
            <!-- Commit step divs injected by JS -->
        </div>
        <div id="scatter-plot">
            <h2>Commits by time of day</h2>
            <div id="chart"></div>

            <!-- Tooltip -->
            <dl id="commit-tooltip" class="info tooltip" hidden>
                <dt>Commit</dt>
                <dd><a href="" id="commit-link" target="_blank"></a></dd>
                <dt>Date</dt>
                <dd id="commit-date"></dd>
                <dt>Time</dt>
                <dd id="commit-time-detail"></dd>
                <dt>Author</dt>
                <dd id="commit-author"></dd>
                <dt>Lines edited</dt>
                <dd id="commit-lines"></dd>
            </dl>

            <!-- Brush selection info -->
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <!-- File unit visualization -->
    <h2>File breakdown</h2>
    <dl id="files"></dl>
</body>
</html>
